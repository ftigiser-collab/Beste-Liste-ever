<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>beste Liste ever — ITS Schichtübersicht</title>
<meta name="description" content="Persönliche Schicht- und Übergabeliste für die Intensivstation. Daten bleiben lokal auf dem Gerät.">
<meta name="theme-color" content="#0e151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="beste Liste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('schicht_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0e151c; --surf:#151f29; --raise:#1c2936; --raise2:#243546;
  --line:#26364a; --line2:#35506a;
  --txt:#e7eef5; --mut:#8ea3b8; --dim:#5f7891;
  --grn:#2ee6a6; --blu:#5b9bd5; --amb:#f2b544; --red:#ff6b6b;
  --grn-soft:rgba(46,230,166,.14); --blu-soft:rgba(91,155,213,.16);
  --amb-soft:rgba(242,181,68,.16); --red-soft:rgba(255,107,107,.16);
  --on-accent:#062a1e; --tint-blu:#d6e8f8; --tint-grn:#bff3e0; --tint-amb:#ffe2a8; --tint-red:#ffd0d0;
  --stripe:rgba(255,255,255,.02); --overlay:rgba(5,9,13,.7); --bar:rgba(14,21,28,.94);
  --r:12px;
}
/* Helles Layout — Farben aus dem Logo (Navy #1d4268, Teal #2c9faa) */
html[data-theme="light"]{
  --bg:#f3f6f9; --surf:#ffffff; --raise:#eef2f6; --raise2:#e1e8f0;
  --line:#d6dee7; --line2:#b4c2d2;
  --txt:#16294a; --mut:#4f6482; --dim:#8394aa;
  --grn:#1f8f9b; --blu:#1d4268; --amb:#b8730a; --red:#c62f38;
  --grn-soft:rgba(44,159,170,.16); --blu-soft:rgba(29,66,104,.12);
  --amb-soft:rgba(184,115,10,.14); --red-soft:rgba(198,47,56,.12);
  --on-accent:#ffffff; --tint-blu:#16294a; --tint-grn:#0f5c64; --tint-amb:#6d4300; --tint-red:#8f1d24;
  --stripe:rgba(22,41,74,.035); --overlay:rgba(22,41,74,.45); --bar:rgba(243,246,249,.94);
}
html[data-theme="light"] .cnt{color:#fff}
html[data-theme="light"] .dot.on{box-shadow:none}
html[data-theme="light"] .paper{box-shadow:0 6px 30px rgba(22,41,74,.18);border:1px solid var(--line)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bar);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand b{font-weight:600}
.brand span{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{min-height:40px;padding:0 14px;border-radius:9px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab.on{background:var(--raise2);color:var(--txt)}
.cnt{background:var(--red);color:#1a0a0a;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600;line-height:18px}
.cnt.amb{background:var(--amb)}
.shiftbtn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.shiftbtn.on{border-color:rgba(46,230,166,.45);color:var(--grn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.iconbtn{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);padding:0 10px}
.iconbtn:active{background:var(--raise)}
main{flex:1;padding:16px;max-width:1440px;width:100%;margin:0 auto}
.viewhead{display:flex;align-items:baseline;gap:14px;margin:4px 0 14px}
.viewhead h1{font-size:20px;font-weight:600;margin:0}
.viewhead .sub{color:var(--mut)}
.viewhead .grow{flex:1}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--grn);color:var(--on-accent);border-color:transparent}
.btn.blue{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.4)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);color:var(--mut);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surf)}
.chip.on{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.chip.grn{background:var(--grn-soft);border-color:var(--grn);color:var(--tint-grn)}
.chip.static{min-height:26px;font-size:13px;padding:0 9px;border-color:var(--line);color:var(--txt)}

/* Zimmerplan */
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.rooms{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.rooms{grid-template-columns:repeat(2,1fr)}}
.room{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.room-h{color:var(--mut);font-size:13px;padding:0 4px;display:flex;justify-content:space-between}
.bed{display:grid;grid-template-columns:28px 1fr auto;grid-template-rows:auto auto;align-items:center;gap:2px 8px;min-height:64px;padding:8px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line);width:100%}
.bed.mine{border-color:rgba(46,230,166,.45);background:linear-gradient(90deg,var(--grn-soft),var(--raise) 55%)}
.bed.other{color:var(--mut)}
.bed.empty{border-style:dashed;color:var(--dim);background:transparent}
.bed.hasHot{box-shadow:inset 3px 0 0 var(--red)}
.bed-pl{grid-row:1/3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);color:var(--mut);font-weight:600;font-size:14px}
.bed.mine .bed-pl{color:var(--grn)}
.bed-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed-meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.bed-sub{grid-column:2/4;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed.empty .bed-sub{grid-column:2/4}

/* Liste */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.pcard{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;position:relative}
.pcard.mine{border-left:3px solid var(--grn)}
.pcard.hasHot{border-left-color:var(--red)}
.pcard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bedtag{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:600;font-size:14px}
.pcard-h b{font-size:17px}
.tag{color:var(--mut);font-size:13px}
.ve{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:flex-start}
.lb{flex:none;width:76px;color:var(--dim);font-size:12px;padding-top:5px;text-transform:none}
.sysdots{display:flex;gap:6px;flex-wrap:wrap}
.sd{min-width:34px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--raise);color:var(--dim);border:1px solid var(--line);padding:0 7px}
.sd.auff{background:var(--amb-soft);color:var(--amb);border-color:rgba(242,181,68,.45)}
.sd.hot{background:var(--red-soft);color:var(--red);border-color:rgba(255,107,107,.5)}
.sd.bess{background:var(--grn-soft);color:var(--grn);border-color:rgba(46,230,166,.45)}
.sd.has{color:var(--mut)}
.others{margin-top:22px}
.others h2{font-size:15px;color:var(--mut);font-weight:500;margin:0 0 8px}
.orow{display:grid;grid-template-columns:64px 160px 1fr 1fr;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;background:var(--surf);border:1px solid var(--line);margin-bottom:6px;color:var(--mut)}
.orow b{color:var(--txt)}
.orow .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.orow{grid-template-columns:64px 1fr}.orow .hidesm{display:none}}

/* Kette */
.kette{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.kette .arr{color:var(--dim);padding:0 3px;font-size:15px}
.pill{display:inline-flex;align-items:baseline;gap:6px;min-height:30px;padding:3px 10px;border-radius:8px;background:var(--raise);border:1px solid var(--line);font-size:14px;line-height:1.3}
.pill .pd{color:var(--dim);font-size:11px}
.pill.cur{border-color:var(--line2);background:var(--raise2);font-weight:500}
.pill.new{box-shadow:inset 0 -2px 0 var(--grn)}
.pill.more{color:var(--dim);border-style:dashed}
.kette.compact .pill{min-height:24px;padding:1px 8px;font-size:13px}
.empty{color:var(--dim);font-size:14px;padding:4px 0}

/* Fokus */
.fgroup{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fgroup-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;width:100%}
.fitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fitem .what{flex:1}
.fitem .src{color:var(--dim);font-size:12px;white-space:nowrap}
.fitem.sys .what{color:var(--txt)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--grn)}
.check.on{border-color:var(--grn);background:var(--grn-soft)}
.flame{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);flex:none;font-size:13px;font-weight:700}
.flame.on{background:var(--red-soft);border-color:rgba(255,107,107,.6);color:var(--red)}

/* Patient detail */
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h1{margin:0;font-size:22px;font-weight:600}
.phead .grow{flex:1}
.minetoggle{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:8px;color:var(--mut)}
.minetoggle.on{border-color:rgba(46,230,166,.5);color:var(--grn);background:var(--grn-soft)}
.pgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-h h2{margin:0;font-size:15px;font-weight:600}
.sec-h .hint{color:var(--dim);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.auff{border-color:rgba(242,181,68,.45)}
.sec.hot{border-color:rgba(255,107,107,.6);box-shadow:inset 3px 0 0 var(--red)}
.sec.bess{border-color:rgba(46,230,166,.45)}
.flag{min-width:40px;height:32px;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:12px;color:var(--mut);flex:none}
.flag.auff{background:var(--amb-soft);border-color:var(--amb);color:var(--amb)}
.flag.hot{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.flag.bess{background:var(--grn-soft);border-color:var(--grn);color:var(--grn)}
.flagpick{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}
.flagpick .flag{min-height:40px;padding:0 14px;font-size:14px;opacity:.75}
.flagpick .flag.ok{color:var(--txt)}
.flagpick .flag.sel{opacity:1;outline:2px solid currentColor;outline-offset:1px}
.entries{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.entry{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:baseline;padding:7px 8px;border-radius:8px;width:100%;border-left:2px solid transparent}
.entry:nth-child(even){background:var(--stripe)}
.entry.new{border-left-color:var(--grn)}
.entry.last{font-weight:500}
.entry .et{color:var(--dim);font-size:12px}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1}
.addbtn{width:44px;height:44px;border-radius:10px;background:var(--blu-soft);border:1px solid var(--blu);color:var(--tint-blu);display:grid;place-items:center;font-size:22px;flex:none}
.addbtn.grn{background:var(--grn-soft);border-color:rgba(46,230,166,.5);color:var(--grn)}
.chipsrow{margin-top:8px}
.editrow{display:flex;flex-direction:column;gap:8px;background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px}
.editrow .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.task{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;width:100%}
.task .tt{flex:1;padding:6px 0;line-height:1.3}
.task.done .tt{color:var(--dim);text-decoration:line-through}
.task.hot .tt{color:var(--tint-red);font-weight:500}
.task .td{color:var(--dim);font-size:12px;white-space:nowrap}
.task.new .tt::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);margin-left:8px;vertical-align:middle}

/* Modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:18px;width:min(880px,100%);display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--mut);font-size:13px}
.roomgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rbtn{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);display:grid;place-items:center;font-weight:600}
.rbtn.on{background:var(--blu-soft);border-color:var(--blu);color:var(--tint-blu)}
.rbtn.busy{color:var(--dim);background:transparent;border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;padding:0 18px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--blu-soft);color:var(--tint-blu)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .acts .left{margin-right:auto}
.warn{color:var(--amb);font-size:14px}
.menu{position:absolute;right:16px;top:60px;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:6px;z-index:30;min-width:220px;display:flex;flex-direction:column}
.menu button{min-height:44px;padding:0 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
.menu button:active{background:var(--raise)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raise2);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.banner{background:var(--amb-soft);border:1px solid var(--amb);color:var(--tint-amb);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}

/* Druck */
.druck-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.paper{background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:14mm 14mm 16mm;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  font:10.5pt/1.32 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.paper h1{font-size:15pt;margin:0;font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #111;padding-bottom:4pt;margin-bottom:8pt}
.ph .meta{color:#444;font-size:9.5pt}
.pnote{border:1pt solid #999;padding:4pt 6pt;margin-bottom:8pt;background:#f5f5f5}
.pp{border-top:1pt solid #bbb;padding:6pt 0 7pt;break-inside:avoid;page-break-inside:avoid}
.pp-h{display:flex;gap:8pt;align-items:baseline;flex-wrap:wrap;margin-bottom:3pt}
.pp-h .zi{font-weight:700;border:1.2pt solid #111;padding:0 5pt;border-radius:3pt}
.pp-h .nm{font-weight:700;font-size:11.5pt}
.pp-h .tg{color:#555;font-size:9.5pt}
.pp-h .ve{color:#333;font-size:9.5pt;flex-basis:100%}
.pr{display:grid;grid-template-columns:62pt 1fr;gap:6pt;padding:1.5pt 0}
.pr .l{color:#666;font-size:9pt;padding-top:1pt}
.pr .v{min-width:0}
.pk .sp{color:#888;padding:0 3pt}
.pk .cur{font-weight:600}
.pk .n{border-bottom:1.5pt solid #111}
.pk .d{color:#888;font-size:8.5pt;margin-right:2pt}
.pk .ctx{color:#777}
.bs .h{font-weight:700}
.bs .h::before{content:"■ ";color:#111}
.bs .o::before{content:"□ "}
.bs span{margin-right:10pt;display:inline-block}
.pl .o::before{content:"☐ ";}
.pl .d{color:#888;text-decoration:line-through}
.pl .d::before{content:"☑ "}
.pl span{margin-right:10pt;display:inline-block}
.psys{margin-top:3pt;border-top:.5pt dotted #bbb;padding-top:3pt;display:grid;grid-template-columns:1fr 1fr;gap:0 12pt}
.psys .pr{grid-template-columns:52pt 1fr}
.psys .pr.f-auff .l{color:#a86b00;font-weight:600}
.psys .pr.f-hot .l{color:#b00020;font-weight:700}
.psys .pr.f-hot .l::before{content:"■ "}
.psys .pr.f-bess .l{color:#1a7f4b;font-weight:600}
.psys .pr.f-bess .l::before{content:"↗ "}
.ptab{width:100%;border-collapse:collapse;margin-top:6pt;font-size:9.5pt}
.ptab th{text-align:left;border-bottom:1pt solid #111;padding:2pt 4pt;font-weight:600;color:#333}
.ptab td{border-bottom:.5pt solid #ccc;padding:3pt 4pt;vertical-align:top}
.ptab td:first-child{white-space:nowrap;font-weight:600}
.pfoot{margin-top:10pt;color:#777;font-size:8.5pt;display:flex;justify-content:space-between}
.psec{margin-top:10pt;font-size:11pt;font-weight:700;border-bottom:1pt solid #111;padding-bottom:2pt}
.pempty{color:#777;font-style:italic;padding:6pt 0}

@media print{
  @page{margin:11mm 12mm}
  html,body{background:#fff;color:#111}
  .topbar,.no-print,.toast,.menu,.modal-bg{display:none!important}
  main{padding:0;max-width:none}
  .paper{box-shadow:none;border-radius:0;padding:0;max-width:none;margin:0}
  .pk .n{border-bottom:1.5pt solid #000}
}

@media (max-width:900px){
  .topbar{gap:8px;padding:8px 10px}
  .brand{display:none}
  .tabs{margin-left:0;flex:1;overflow-x:auto;scrollbar-width:none}
  .tab{padding:0 10px}
  .shiftbtn{padding:0 10px}
  main{padding:12px}
}

/* Vorerkrankungen-Picker */
.cdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chip.ve{gap:7px}
.chip.ve .x{color:var(--mut);margin-left:2px;font-size:16px;line-height:1}
.chip.static.ve{min-height:28px;gap:6px}
.vesel{padding:8px;border:1px dashed var(--line2);border-radius:10px;margin-bottom:8px}
.vegroup{margin-top:12px}
.vegroup-h{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin-bottom:6px}
.addbtn:disabled{opacity:.35}

/* zweite Chip-Zeile: Symbole + Verlaufswörter */
.tier2{margin-top:6px}
.tier2 .chip{min-height:30px;font-size:13px;padding:0 10px;color:var(--dim);border-color:var(--line)}
.tier2 .chip.sym{min-width:44px;min-height:30px;justify-content:center;font-size:17px;font-weight:600;color:var(--txt);border-color:var(--line2);background:var(--raise)}
.tier2 .tsep{width:1px;align-self:stretch;background:var(--line2);margin:0 4px;flex:none}

/* Hauptdiagnose */
.diag-row{flex-basis:100%;display:flex;gap:10px;align-items:flex-start;margin-top:2px}
.diag-row .lb{width:auto;white-space:nowrap}
input.diag{background:var(--surf);border-color:var(--line);font-size:17px;font-weight:600;color:var(--grn);padding:8px 12px}
input.diag::placeholder{color:var(--dim);font-weight:400}
.diag-line{font-size:16px;font-weight:600;color:var(--grn);margin-top:-4px}
.pp-h .dg{font-weight:600;flex-basis:100%;margin-top:1pt}

/* Chip-Gruppen als Reiter */
.gtabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.gtab{min-height:34px;padding:0 12px;color:var(--dim);font-size:13px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.gtab.on{color:var(--txt);border-bottom-color:var(--blu)}
.gtabs + .chipsrow{margin-top:8px}

/* Labor je System */
.labblock{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.lab-h{color:var(--dim);font-size:12px;margin-bottom:4px}
.labrow{display:grid;grid-template-columns:32px 118px 1fr 22px;gap:6px;align-items:center;padding:3px 0;border-radius:8px}
.labrow.imp{background:var(--amb-soft)}
.star{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:17px}
.star.on{color:var(--amb)}
.labname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labname .unit{color:var(--dim);font-weight:400;font-size:11px;margin-left:4px}
.labvals{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 1px;min-width:0}
.labvals .arr{color:var(--dim);padding:0 2px;font-size:13px}
.lv{display:inline-flex;align-items:baseline;gap:4px;min-height:28px;padding:2px 8px;border-radius:7px;background:var(--raise);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.lv .pd{color:var(--dim);font-size:10px}
.lv.cur{font-weight:600;border-color:var(--line2);background:var(--raise2)}
.lv.new{box-shadow:inset 0 -2px 0 var(--grn)}
.lv.more{color:var(--dim);border-style:dashed}
.trend{font-size:16px;font-weight:700;text-align:center}
.tup,.tdown{color:var(--txt)} .tflat{color:var(--dim)}
.labchips{flex:1}
.chip.dash{border-style:dashed;color:var(--dim)}
input.labinput{max-width:280px}
.chip.static.lab{gap:6px}
.chip.static.lab .tr{font-weight:700}

/* Druck */
.plab{display:block;margin-top:1pt;color:#333;font-size:9pt}
.plab .pl1{margin-right:8pt;white-space:nowrap}
.plab .pl1.imp{font-weight:700}
.plab .pl1.imp::before{content:"★ "}
.plab .sp{color:#999;padding:0 1pt}
.plab .n{border-bottom:1pt solid #000}
.plab .tr{font-weight:700}

/* To-Do mit Priorität */
.prio{min-height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--mut);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.prio.p1{background:var(--red-soft);border-color:rgba(255,107,107,.6);color:var(--red)}
.prio.p2{background:var(--amb-soft);border-color:rgba(242,181,68,.5);color:var(--amb)}
.prio.p3{color:var(--mut)}
.prio.sel{outline:2px solid currentColor;outline-offset:1px}
.task.done .prio{opacity:.4}
.prioseg{display:flex;gap:8px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.prioseg .prio{min-height:36px;padding:0 14px;font-size:13px;opacity:.7}
.prioseg .prio.sel{opacity:1}
.fitem .bedtag{flex:none}
/* Druck */
.ptodo .o.p1{font-weight:700}
.ptodo .o.p1::before{content:"☐ ‼ "}
.ptodo .o.p3{color:#777}

/* Volumen-Panel */
.volpanel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
@media (max-width:980px){.volpanel{grid-template-columns:1fr}}
.voltile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.voltile-h{color:var(--mut);font-size:13px}
.volbig{font-size:22px;font-weight:600;line-height:1.2}
.voltile.st-hypo{border-color:rgba(91,155,213,.6)} .voltile.st-hypo .volbig{color:var(--blu)}
.voltile.st-eu{border-color:rgba(46,230,166,.5)} .voltile.st-eu .volbig{color:var(--grn)}
.voltile.st-hyper{border-color:rgba(242,181,68,.6)} .voltile.st-hyper .volbig{color:var(--amb)}
.voltile.st-none .volbig,.voltile.zi-none .volbig{color:var(--dim);font-weight:400;font-size:18px}
.volseg{display:flex}
.volseg button{flex:1;min-height:40px;padding:0 6px;font-size:14px;text-align:center}
.volseg button.on.st-hypo{background:var(--blu-soft);color:var(--tint-blu)}
.volseg button.on.st-eu{background:var(--grn-soft);color:var(--tint-grn)}
.volseg button.on.st-hyper{background:var(--amb-soft);color:var(--tint-amb)}
.mlrow{border-top:1px solid var(--line);padding-top:6px}
.mlrow:first-of-type{border-top:0;padding-top:0}
.mlhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mllab{color:var(--mut);font-size:13px}
.mlbig{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.mlbig.pos{color:var(--amb)} .mlbig.neg{color:var(--blu)}
.volwarn{color:var(--red);font-size:14px;font-weight:500}
.volpanel.warn .voltile:last-child{border-color:rgba(255,107,107,.6)}
.chip.static.vs{min-height:28px;gap:5px}
.chip.static.vs.st-hypo{border-color:var(--blu);color:var(--tint-blu)}
.chip.static.vs.st-eu{border-color:var(--grn);color:var(--tint-grn)}
.chip.static.vs.st-hyper{border-color:var(--amb);color:var(--tint-amb)}
.chip.static.vs.warnchip{border-color:var(--red);color:var(--tint-red)}
.volrow.warn .lb{color:var(--red)}
/* Druck */
.pvol .v{font-size:10pt}
.pvol .pwarn{font-weight:700}

/* Logo im Kopf */
.brand .logo{height:40px;width:auto;display:block}
.brand span{margin-top:2px}
.menu .foot{color:var(--dim);font-size:12px;padding:8px 12px 4px}
.updbar{display:flex;align-items:center;gap:12px;justify-content:space-between}

</style>
</head>
